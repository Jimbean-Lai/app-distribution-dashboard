<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App发布看板</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--panel:#ffffff;--panel2:#f2f2f7;--line:rgba(0,0,0,.08);--hairline:#d2d2d7;--txt:#1d1d1f;--mut:#86868b;--acc:#0071e3;--btn-ink:#ffffff;--ok:#1d8a3e;--err:#d70015;--warn:#c93400;--hdr-bg:rgba(255,255,255,.72);--aside-bg:rgba(245,245,247,.85);--hov:rgba(0,0,0,.05);--hov2:rgba(0,0,0,.04);--btn2-bg:#ffffff;--btn2-hov:#f8f8fa;--chip-bg:#f2f2f7;--input-bg:#ffffff;--card-border:rgba(0,0,0,.06);--card-shadow:0 8px 24px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);--console-bg:#f8f8fa;--console-txt:#3a3a3c;--tint-ok:#e8f6ec;--tint-err:#fdeceb;--tint-warn:#fdf0e7;--tint-blue:#e8f1fd;--tint-gray:#f0f4f8;--pending-txt:#0066cc;--draft-txt:#43688c;--ov-bg:rgba(0,0,0,.4);--modal-border:rgba(0,0,0,.06);--modal-shadow:0 20px 60px rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.08);--sb-thumb:rgba(0,0,0,.18);--sb-thumb-hov:rgba(0,0,0,.28);--sel:rgba(0,113,227,.18);--focus-ring:rgba(0,113,227,.15);--bdg-ok-bd:rgba(29,138,62,.35);--bdg-err-bd:rgba(215,0,21,.35)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f172a;--panel:#1e293b;--panel2:#294061;--line:#3b4a63;--hairline:#3b4a63;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--btn-ink:#0a1628;--ok:#4ade80;--err:#f87171;--warn:#fbbf24;--hdr-bg:rgba(20,33,58,.85);--aside-bg:rgba(13,22,38,.85);--hov:#22406b;--hov2:#1d3357;--btn2-bg:#23395e;--btn2-hov:#2c4a75;--chip-bg:#23395e;--input-bg:#0d1626;--card-border:#3b4a63;--card-shadow:0 8px 24px rgba(0,0,0,.35);--console-bg:#0a1322;--console-txt:#e2e8f0;--tint-ok:#14532d;--tint-err:#7f1d1d;--tint-warn:#78350f;--tint-blue:#1e4d6b;--tint-gray:#1e3a5f;--pending-txt:#7dd3fc;--draft-txt:#38bdf8;--ov-bg:rgba(2,6,23,.6);--modal-border:#3b4a63;--modal-shadow:0 20px 60px rgba(0,0,0,.5);--sb-thumb:rgba(148,163,184,.3);--sb-thumb-hov:rgba(148,163,184,.45);--sel:rgba(56,189,248,.25);--focus-ring:rgba(56,189,248,.2);--bdg-ok-bd:#4ade80;--bdg-err-bd:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease}
header,aside,.card,.modal,.result,.badge,.state{transition:background-color .3s ease,border-color .3s ease}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hov)}
::-webkit-scrollbar-track{background:transparent}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--hdr-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);height:52px;flex-shrink:0}
header h1{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
header .tag{color:var(--mut);font-size:12px;margin-left:10px}
.hdr-right{display:flex;gap:8px;align-items:center}
button{background:var(--acc);color:var(--btn-ink);border:none;border-radius:980px;padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;transition:transform .25s cubic-bezier(.25,1,.5,1),filter .2s ease}
button:hover{filter:brightness(1.06)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
button.secondary{background:var(--btn2-bg);color:var(--txt);border:1px solid var(--hairline)}
button.secondary:hover{background:var(--btn2-hov);filter:none}
button.sm{padding:4px 11px;font-size:11.5px}
.layout{display:flex;flex:1;overflow:hidden}
aside{width:230px;flex-shrink:0;background:var(--aside-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
aside .cat-title{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 6px;font-weight:600}
aside .app-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt);margin-bottom:2px;transition:background .2s ease}
aside .app-item:hover{background:var(--hov)}
aside .app-item.active{background:var(--acc);color:var(--btn-ink);font-weight:600}
aside .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
main{flex:1;overflow-y:auto;padding:18px 22px 40px;background:var(--bg)}
.app-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-head h2{font-size:20px;letter-spacing:-.02em}
.badge{background:var(--chip-bg);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--txt)}
.badge.ok{color:var(--ok);border-color:var(--bdg-ok-bd);background:var(--tint-ok)}
.badge.err{color:var(--err);border-color:var(--bdg-err-bd);background:var(--tint-err)}
.mini-btn{background:var(--acc);color:var(--btn-ink);border:none;border-radius:980px;padding:3px 12px;font-size:11px;cursor:pointer;font-weight:600;transition:transform .25s cubic-bezier(.25,1,.5,1),filter .2s ease}
.mini-btn:hover{filter:brightness(1.08)}
.mini-btn:active{transform:scale(.96)}
.scroll{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;box-shadow:var(--card-shadow)}
.card h3{font-size:13.5px;color:var(--acc);margin-bottom:10px;font-weight:600;letter-spacing:-.01em}
.card .row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
.card .row:last-child{border:none}
.k{color:var(--mut)}
.v{color:var(--txt);max-width:65%;text-align:right;word-break:break-all}
.input-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.input-row input{flex:1;background:var(--input-bg);color:var(--txt);border:1px solid var(--hairline);border-radius:8px;padding:7px 9px;font-size:12.5px;min-width:0}
input,select,textarea{background:var(--input-bg);color:var(--txt);border:1px solid var(--hairline);border-radius:8px;padding:7px 9px;font-size:12.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--focus-ring)}
input[type=datetime-local]{background:#fff;color:#1d1d1f;border:1px solid #d2d2d7;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;min-height:28px;box-shadow:0 1px 3px rgba(0,0,0,.08);-webkit-appearance:none;appearance:none}
input[type=datetime-local]::-webkit-calendar-picker-indicator{cursor:pointer;padding:4px}
textarea{min-height:48px;resize:vertical}
form-row{display:flex;gap:10px}
form-row>*{flex:1}
label{display:block;color:var(--mut);font-size:11px;margin:8px 0 3px}
.check{display:flex;align-items:center;gap:6px;margin:10px 0;font-size:12.5px;color:var(--txt)}
.check input{width:auto}
.actions{display:flex;gap:8px;margin:10px 0}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.status-grid .card .state{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.state{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.state.published{background:var(--tint-ok);color:var(--ok)}
.state.reviewing{background:var(--tint-warn);color:var(--warn)}
.state.pending{background:var(--tint-blue);color:var(--pending-txt)}
.state.draft,.state.submitted{background:var(--tint-gray);color:var(--draft-txt)}
.state.rejected{background:var(--tint-err);color:var(--err)}
.state.unknown{background:var(--chip-bg);color:var(--mut)}
.result{background:var(--console-bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;max-height:220px;overflow-y:auto;color:var(--console-txt)}
.result div{white-space:pre-wrap;word-break:break-all}
.result .ok{color:var(--ok)}
.result .err{color:var(--err)}
.hide{display:none}
.muted{color:var(--mut);font-size:12px}
#tsteps{font-size:12px;max-height:130px;overflow-y:auto;margin-top:8px;color:var(--txt)}
#tsteps div{padding:2px 0;display:flex;align-items:center;gap:6px}
#tsteps div .icn{font-size:14px;flex-shrink:0;display:inline-block;min-width:1.2em;text-align:center}
#tsteps div .icn.ok{color:var(--ok)}
#tsteps div .icn.err{color:var(--err)}
#tsteps div .icn.cur{color:var(--acc);animation:pulseicn 1s infinite}
@keyframes pulseicn{0%,100%{opacity:1}50%{opacity:.4}}
#tinfo{font-size:14px;font-weight:600;margin-bottom:4px}
#tstage{font-size:12.5px;color:var(--acc);margin:4px 0}
#tmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:4px}
#tmeta .tlabel{color:var(--mut);align-self:center;margin-right:2px}
#tmeta .platform-chip{background:var(--chip-bg);border-radius:12px;padding:2px 10px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;border:1px solid transparent;transition:box-shadow .15s,border-color .15s}
#tmeta .platform-chip:hover{border-color:var(--acc)}
#tmeta .platform-chip.ok{background:var(--tint-ok);color:var(--ok)}
#tmeta .platform-chip.err{background:var(--tint-err);color:var(--err)}
#tmeta .platform-chip.run{background:var(--tint-blue);color:var(--pending-txt)}
#tmeta .platform-chip.sel{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}
.overlay{position:fixed;inset:0;background:var(--ov-bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:var(--panel);border:1px solid var(--modal-border);border-radius:14px;padding:18px;min-width:380px;max-width:90vw;max-height:70vh;overflow-y:auto;box-shadow:var(--modal-shadow)}
.file-item{padding:8px 6px;border-bottom:1px dashed var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.file-item:hover{background:var(--hov2)}
.file-item .fname{flex:1}
@media(max-width:760px){.layout{flex-direction:column}aside{width:100%;max-height:140px}.grid{grid-template-columns:1fr}}
.plat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px}
.plat-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.plat-item input{width:auto;margin:0}
</style>
</head>
<body>
<header>
  <div style=display:flex;align-items:center;gap:12px><h1>App发布看板</h1><span class=muted id=cfg></span></div>
  <div class=hdr-right><button class="secondary sm" id="themeBtn" onclick="toggleTheme()">🌙 深色</button><button class=secondary sm onclick=ld()>刷新</button><button class=secondary sm onclick=validateAll()>校验凭证</button></div>
</header>
<div class=layout>
  <aside id=sb></aside>
  <main>
    <div id=appc><!-- 应用详情+发布表单 --></div>
    <div id=progress class=hide><div class=card>
      <div style=display:flex;justify-content:space-between;align-items:start;gap:8px><div><b style=font-size:14px id=tinfo></b><div id=tmeta></div></div><button class="secondary sm" onclick=stopPoll() id=tclose style=display:none>×</button></div>
      <div id=tstage></div>
      <div id=tup style="font-size:12px;color:var(--acc);margin-top:5px;min-height:16px"></div>
      <div id=tsteps></div>
    </div></div>
    <div class=scroll>
      <div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="color:var(--acc);font-size:14px;margin:0">平台状态</h3><button class="secondary sm hide" id="shareBtn" onclick="shareStatus()">📋 分享</button></div><div id=sg class=status-grid><div class=muted>点击「查询状态」查看</div></div></div>
      <div><div style=display:flex;justify-content:space-between;align-items:center;margin-bottom:8px><h3 style=color:var(--acc);font-size:14px;margin:0>发布历史</h3><button class="secondary sm" onclick=clearHistory()>清空</button></div><div id=sh><div class=muted>暂无发布记录</div></div></div>
      <div><h3 style=color:var(--acc);font-size:14px;margin-bottom:8px>日志</h3><div id=lg class=result><div>就绪</div></div></div>
    </div>
  </main>
</div>
<div id=toast class=overlay style=display:none></div>
<script>
var ST={apps:[],cats:[],cur:null,plt:[],POLL:null};
function $(v){return document.getElementById(v)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(p,o){return fetch(p,o).then(function(r){return r.json().catch(function(){return{}})})}
function toast(m,t){var e=$("toast");e.style.display="flex";e.innerHTML='<div class="modal" style="width:auto;max-width:400px;text-align:center">'+esc(m)+'<div style="margin-top:12px"><button id=tb>确定</button></div></div>';e.style.background="transparent";clearTimeout(e._t);e._t=setTimeout(close,2600);var b=e.querySelector('#tb');if(b)b.addEventListener('click',close)}
function close(){ $("toast").style.display="none" }
function lg(t,c){var e=$("lg");if(e){var d=document.createElement("div");d.className=c||"";d.textContent=t;e.appendChild(d);e.scrollTop=e.scrollHeight}}
function busy(o){document.querySelectorAll("button,input,select,textarea").forEach(function(b){b.disabled=o})}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("dshTheme",t)}catch(e){}var b=$("themeBtn");if(b)b.textContent=t==="dark"?"☀️ 浅色":"🌙 深色"}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")}
setTheme(function(){try{return localStorage.getItem("dshTheme")||"light"}catch(e){return "light"}}());
function stat(ch){var m={published:"已上架",reviewing:"审核中",pending:"待发布",draft:"草稿",submitted:"已提交",rejected:"已拒绝",unknown:"未知"};return m[ch]||ch}
function ld(){Promise.all([api("/api/apps"),api("/api/platforms"),api("/api/config"),api("/api/tasks")]).then(function(rs){ST.apps=rs[0].apps||[];ST.cats=rs[0].categories||[];ST.platforms=rs[1]||[];$("cfg").textContent="凭证: "+(rs[2].credentials||"");renderSb();if(ST.apps.length){if(!ST.cur||!ST.apps.find(function(a){return a.id===ST.cur.id}))sa(ST.apps[0].id);else renderMain()}var hist=(rs[3]&&rs[3].history)||[];renderHistory(hist.slice(0,8))}).catch(function(e){console.error(e)})}
function renderSb(){var h="";(ST.cats||[]).forEach(function(c){h+='<div class=cat-title>'+esc(c.name)+"</div>";(ST.apps||[]).filter(function(a){return a.category===c.name}).forEach(function(a){var act=ST.cur&&ST.cur.id===a.id?"active":"";var dot=a.package_name?'<span class=dot style=background:var(--ok)></span>':'<span class=dot style=background:var(--warn)></span>';h+='<div class="app-item '+act+'" data-id="'+esc(a.id)+'" onclick="sa(this.dataset.id)">'+dot+'<span>'+esc(a.name)+"</span></div>"})});$("sb").innerHTML=h}
function sa(id){ST.cur=(ST.apps||[]).find(function(a){return a.id===id})||null;ST.statuses=null;var _sb=$("shareBtn");if(_sb)_sb.classList.add("hide");var _sg=$("sg");if(_sg)_sg.innerHTML='<div class=muted>点击「查询状态」查看</div>';renderSb();renderMain()}
function renderMain(){if(!ST.platforms&&!ST.apps.length){setTimeout(renderMain,250);return}var a=ST.cur;if(!a){$("appc").innerHTML='<div class=muted>请选择左侧应用</div>';return}
var h='<div class=app-head><h2>'+esc(a.name)+'</h2>'+(a.category_display?'<span class=badge>'+esc(a.category_display)+'</span>':'')+(a.package_name?'<span class="badge" style=color:var(--ok)>'+esc(a.package_name)+'</span>':'<span class="badge err">未配包名</span>')+"</div>";
h+='<div class=grid><div class=card><h3>应用信息</h3>'+
'<div class=row><span class=k>包名</span><span class=v>'+esc(a.package_name||"未填")+'</span></div>'+
'<div class=row><span class=k>versionName</span><span class=v>-</span></div>'+
'<div class=row><span class=k>versionCode</span><span class=v>-</span></div>'+(a.huawei_harmony_package?'<div class=row><span class=k>华为 Harmony 包</span><span class=v>'+esc(a.huawei_harmony_package)+'</span></div>':"")+'</div>';
h+='<div class=card><h3>构建产物</h3>'+
'<div class=input-row><input id=paab value="" placeholder="AAB (Google Play)"><button class=sm secondary onclick=selBuild("aab")>选择…</button><button class=sm secondary onclick=clr("paab")>清</button></div>'+
'<div class=input-row><input id=papk value="" placeholder="APK (国内平台)"><button class=sm secondary onclick=selBuild("apk")>选择…</button><button class=sm secondary onclick=clr("papk")>清</button></div>'+
'<div id=papkAlert style=font-size:12px;margin:4px 0;min-height:16px></div><div style=margin-top:4px><button onclick=pth()>保存路径</button></div></div>';
h+='<div class=card><h3>发布</h3>'+
'<div><label>版本名</label><input id=ipvn readonly value=""></div>'+
'<div><label>versionCode</label><input id=ipvc readonly value=""></div>'+
'<div><label>发布平台（可多选，Apple 仅查询）</label><div id=ipp style=display:flex;flex-wrap:wrap;gap:8px>'+publishPlatsHTML()+'</div><div style=margin-top:6px><button type=button class=sm secondary onclick=platAll(1)>全选</button> <button type=button class=sm secondary onclick=platAll(0)>清空</button></div></div>'+
'<div><label>轨道（Google）</label><select id=ipv><option>production</option><option>beta</option><option>alpha</option><option>internal</option></select></div>'+
'<div><label>更新说明</label><textarea id=ipn rows=2></textarea><div class=form-group><label>定时上线（留空=立即）</label><input id=pot type=datetime-local></div></div>'+
'<div class=check><input type=checkbox id=ipdry checked><label for=ipdry>仅校验（dry-run）</label> <input type=checkbox id=ipauto style=margin-left:14px><label for=ipauto>Google 自动送审（不勾=存草稿）</label></div>'+
'<div class=actions>'+(a.query_only?'<button class=secondary disabled title="仅查询应用不支持发布">发布于 AGC 控制台</button>':'<button onclick=dpub()>发布</button>')+'<button class=secondary onclick=ds()>查询状态</button></div></div></div>';
$("appc").innerHTML=h}
function row(k,v){return'<div class=row><span class=k>'+esc(k)+'</span><span class=v>'+v+"</span></div>"}
function clr(x){$(x).value="";pth()}
function fp(t){var a=ST.cur;if(!a)return;api("/api/files").then(function(f){var l=(f&&f[t])||[];if(!l.length){toast("未检测到"+t.toUpperCase()+"文件","err");return}
var h='<div class="overlay" onclick="if(event.target===this)cm()"><div class="modal"><h3 style=margin-bottom:8px>选择 '+t.toUpperCase()+" 文件</h3>";(l||[]).forEach(function(x){var z=x.size>1e6?(x.size/1e6).toFixed(1)+" MB":Math.max(1,Math.round(x.size/1e3))+" KB";h+='<div class="file-item" data-type="'+t+'" data-path="'+esc(x.path)+'" onclick="pick(this)"><span class=fname>'+esc(x.name)+'</span><span class=muted>'+z+"</span></div>"});h+='<div style=margin-top:10px;text-align:right><button class=secondary onclick=cm()>取消</button></div></div></div>';var d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d.firstElementChild)})}
function pick(el){var t=el.dataset.type,p=el.dataset.path;var inp=$(t==="aab"?"paab":"papk");inp.value=p;cm();toast("已选: "+p.split("/").pop());if(ST.cur)autoMeta(p,ST.cur.id,t)}
function selBuild(t){var inp=document.createElement("input");inp.type="file";inp.accept=t==="aab"?".aab":".apk";inp.onchange=function(){if(!inp.files||!inp.files[0])return;onFileChosen(t,inp.files[0])};inp.click()}

var fd=new FormData();fd.append("type",t);fd.append("file",file);

function renderHistory(hist){var e=document.getElementById("sh");if(!e)return;if(!hist||!hist.length){e.innerHTML='<div class=muted>暂无发布记录</div>';return}
var h="";(hist||[]).forEach(function(t){var st=t.status==="done"?"ok":"err";var dn=(t.dry_run?" (dry-run)":"");h+='<div class="card" style="padding:8px 12px;margin-bottom:6px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:12px">'+esc(t.finished_at||"")+' · <b>'+esc(t.app_id)+'</b> → '+esc(t.platform||"")+dn+'</span><span class="state '+st+'">'+(t.status==="done"?"完成":"失败")+'</span></div><div style="font-size:11px;color:var(--mut);margin-top:3px">'+(t.stage||"")+"</div></div>"});e.innerHTML=h}
function clearHistory(){var h='<div class="overlay" onclick="if(event.target===this)clh()"><div class="modal" style="text-align:center;min-width:340px"><p style="margin:8px 0 14px;font-size:15px;font-weight:600">确认清空全部发布历史？</p><p style="color:var(--mut);font-size:13px;margin-bottom:20px">此操作不可撤消，历史记录将被永久删除。</p><div style="display:flex;gap:10px;justify-content:center"><button onclick=doClearHistory() style="background:var(--err)">确认清空</button><button class=secondary onclick=clh()>取消</button></div></div></div>';var d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d.firstElementChild)}
function doClearHistory(){api("/api/tasks/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(function(r){clh();if(r&&r.ok){lg("发布历史已清空","ok");var e=document.getElementById("sh");if(e)e.innerHTML='<div class=muted>暂无发布记录</div>'}else{lg("清空失败: "+JSON.stringify(r),"err")}})}
function clh(){document.querySelectorAll(".overlay").forEach(function(e){if(e.id!=="toast")e.remove()})}
function validateAll(){lg("== 校验凭证 ==");api("/api/validate").then(function(r){(r.validated||[]).forEach(function(x){lg("["+x.platform+"] "+(x.ok?"OK":"ERROR")+(x.message?" "+x.message:""),x.ok?"ok":"err")})})}
ld();
</script>
</body>
</html>
